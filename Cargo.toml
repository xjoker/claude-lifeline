[package]
name = "claude-lifeline"
version = "0.5.0"
edition = "2021"
description = "Claude Code companion — status line, TUI dashboard, config and self-update"

[[bin]]
name = "claude-lifeline"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "io-std", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
anyhow = "1"
toml = { version = "0.8", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
terminal_size = "0.4"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
futures-util = "0.3"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
